name: Validate Config

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate JSON and schemas
        run: npm run validate:decisions && npm run validate

      - name: Check duplicate aliases
        run: npm run check:aliases

      - name: Check version monotonicity
        run: npm run check:versions

      - name: Run tests
        run: npm test

      - name: Build config manifest
        run: npm run build:manifest

      - name: Dry-run worker build
        run: npm run build:worker
