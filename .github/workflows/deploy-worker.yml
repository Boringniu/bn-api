name: Deploy Worker And Reindex

on:
  push:
    branches:
      - main
    paths:
      - config/**
      - src/**
      - migrations/**
      - package.json
      - package-lock.json
      - wrangler.jsonc
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-bn-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full validation
        run: npm run check

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply bn-media --remote

      - name: Sync ingest secret to Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: printf '%s' "$INGEST_TOKEN" | npx wrangler secret put INGEST_TOKEN

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Reindex catalog and refresh pinned index
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          WORKER_URL: https://bn-api.nnmmc326.workers.dev
        run: |
          for attempt in $(seq 1 100); do
            response=$(curl --fail-with-body --silent --show-error \
              --request POST "$WORKER_URL/v1/catalog/reindex" \
              --header "Authorization: Bearer $INGEST_TOKEN")
            echo "$response" | jq '{processed: .data.processed, remaining: .data.remaining, ruleset_version: .data.ruleset_version, index: .data.index}'
            remaining=$(echo "$response" | jq -r '.data.remaining')
            if [ "$remaining" = "0" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "Reindex did not finish after 100 batches." >&2
          exit 1
