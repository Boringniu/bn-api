name: Apply Review Decisions

on:
  push:
    branches:
      - main
    paths:
      - review-decisions.json

permissions:
  contents: write

concurrency:
  group: review-decisions
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate decision file
        run: npm run validate:decisions

      - name: Apply decisions to config
        env:
          REVIEW_TOKEN_EDITOR: ${{ secrets.REVIEW_TOKEN_EDITOR }}
          WORKER_URL: https://bn-api.niu900326.workers.dev
        run: node scripts/apply-review-decisions.mjs

      - name: Validate generated config
        run: npm run check

      - name: Commit generated config
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add review-decisions.json config docs/CHANGELOG.md
          git commit -m "config: apply review decisions"
          git push

      # 使用 GITHUB_TOKEN 推送的提交不会再次触发其他 workflow，
      # 因此在同一次任务里直接部署并完成重编目。
      - name: Deploy generated Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      - name: Reindex catalog and refresh pinned index
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          WORKER_URL: https://bn-api.niu900326.workers.dev
        run: |
          for attempt in $(seq 1 100); do
            response=$(curl --fail-with-body --silent --show-error \
              --request POST "$WORKER_URL/v1/catalog/reindex" \
              --header "Authorization: Bearer $INGEST_TOKEN")
            echo "$response" | jq '{processed: .data.processed, remaining: .data.remaining, ruleset_version: .data.ruleset_version, index: .data.index}'
            remaining=$(echo "$response" | jq -r '.data.remaining')
            if [ "$remaining" = "0" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "Reindex did not finish after 100 batches." >&2
          exit 1
